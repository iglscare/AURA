name: aura-app

services:
  # Production Service (Nginx + Multi-stage Build)
  aura-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-production
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production

  # Local Development Container (Vite Dev Server with HMR)
  aura-dev:
    image: node:20-alpine
    container_name: aura-development
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
